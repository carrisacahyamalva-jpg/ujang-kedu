<html lang="id">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

        <li><a href="design.html">DESIGN</a></li>

    <div class="wrapper-product">
        
        <div id="slide-input" class="kalkulator">
            <h2 class="judul-kalkulator">Kalkulator Gizi</h2>
            
            <label for="berat">Berat Badan (kg):</label>
            <input type="number" id="berat" placeholder="0">

            <label for="tinggi">Tinggi Badan (cm):</label>
            <input type="number" id="tinggi" placeholder="0">

            <button onclick="hitungGizi()">Hitung</button>
        </div>

        <div id="slide-hasil" class="kalkulator" style="display: none;">
            <h2 class="judul-kalkulator">Hasil</h2>
            
            <div id="konten-imt"></div>
            <div id="konten-makanan"></div>
            
            <div id="opsi-olahraga-container" style="display: none;">
                <div class="grup-tombol-opsi">
                    <button class="btn-opsi opsi-santai" onclick="pilihOlahraga('santai')">Santai</button>
                    <button class="btn-opsi opsi-cepat" onclick="pilihOlahraga('cepat')">Cepat Turun</button>
                    <button class="btn-opsi opsi-lama" onclick="pilihOlahraga('lama')">Durasi Lama</button>
                </div>
            </div>

            <div id="konten-olahraga"></div>

            <button onclick="kembaliKeKalkulator()" style="background-color: #6f6261; margin-top: 30px;">Kembali</button>
        </div>

    </div>

    <script>
    var databaseOlahraga = {
        santai: "<strong>Rekomendasi Olahraga:</strong>" +
                "<ul>" +
                "<li>Jalan Kaki Santai (30 menit)</li>" +
                "<li>Bersepeda Statis</li>" +
                "<li>Berenang</li>" +
                "<li>Yoga</li>" +
                "</ul>",
        cepat: "<strong>Rekomendasi Olahraga:</strong>" +
               "<ul>" +
               "<li>HIIT Workout</li>" +
               "<li>Lari Interval</li>" +
               "<li>Lompat Tali</li>" +
               "</ul>",
        lama: "<strong>Rekomendasi Olahraga:</strong>" +
              "<ul>" +
              "<li>Jogging / Power Walking</li>" +
              "<li>Bersepeda Jarak Jauh</li>" +
              "<li>Senam Aerobik / Zumba</li>" +
              "</ul>"
    };

    function hitungGizi() {
        var berat = parseFloat(document.getElementById("berat").value);
        var tinggiCm = parseFloat(document.getElementById("tinggi").value);

        if (!berat || !tinggiCm) {
            alert("Isi data!");
            return;
        }

        var tinggiM = tinggiCm / 100;
        var imt = berat / (tinggiM * tinggiM);
        var status = "";
        var warna = "";
        var makanan = "";
        var olahragaTeks = "";

        var containerOpsi = document.getElementById("opsi-olahraga-container");
        containerOpsi.style.display = "none"; 

        if (imt < 18.5) {
            status = "Gizi Kurang";
            warna = "#ff9800";
            makanan = "<strong>Rekomendasi Makanan:</strong>" +
                      "<ul>" +
                      "<li>Telur, dada ayam, kacang-kacangan, alpukat, susu</li>" +
                      "<li>Makan 5-6 kali sehari porsi kecil</li>" +
                      "</ul>";
            olahragaTeks = "<strong>Rekomendasi Olahraga:</strong>" +
                           "<ul>" +
                           "<li>Latihan beban (push-up, dumbbell)</li>" +
                           "<li>Batasi kardio durasi panjang</li>" +
                           "</ul>";
        } else if (imt >= 18.5 && imt <= 25.0) {
            status = "Normal (Ideal)";
            warna = "#4CAF50";
            makanan = "<strong>Rekomendasi Makanan:</strong>" +
                      "<ul>" +
                      "<li>Karbohidrat kompleks, sayuran, buah, protein</li>" +
                      "<li>Minum air putih 2 liter sehari</li>" +
                      "</ul>";
            olahragaTeks = "<strong>Rekomendasi Olahraga:</strong>" +
