<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoWeby - Product</title>
    <link rel="stylesheet" href="styles.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chango&family=Redressed&display=swap" rel="stylesheet">
</head>
<body>

    <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="design.html">DESIGN</a></li>
        <li><a href="product.html">PRODUCT</a></li>
    </ul>

    <div class="wrapper-product">
        
        <div id="slide-input" class="kalkulator">
            <h2 class="judul-kalkulator">Kalkulator Gizi</h2>
            
            <label for="berat">Berat Badan (kg):</label>
            <input type="number" id="berat" placeholder="0">

            <label for="tinggi">Tinggi Badan (cm):</label>
            <input type="number" id="tinggi" placeholder="0">

            <button onclick="hitungGizi()">Hitung</button>
        </div>

        <div id="slide-hasil" class="kalkulator" style="display: none;">
            <h2 class="judul-kalkulator">Hasil</h2>
            
            <div id="konten-imt"></div>
            <div id="konten-makanan"></div>
            
            <div id="opsi-olahraga-container" style="display: none;">
                <div class="grup-tombol-opsi">
                    <button class="btn-opsi opsi-santai" onclick="pilihOlahraga('santai')">Santai</button>
                    <button class="btn-opsi opsi-cepat" onclick="pilihOlahraga('cepat')">Cepat Turun</button>
                    <button class="btn-opsi opsi-lama" onclick="pilihOlahraga('lama')">Durasi Lama</button>
                </div>
            </div>

            <div id="konten-olahraga"></div>

            <button onclick="kembaliKeKalkulator()" style="background-color: #6f6261; margin-top: 30px;">Kembali</button>
        </div>

    </div>

    <script>
    var databaseOlahraga = {
        santai: "<strong>Rekomendasi Olahraga:</strong>" +
                "<ul>" +
                "<li>Jalan Kaki Santai (30 menit)</li>" +
                "<li>Bersepeda Statis</li>" +
                "<li>Berenang</li>" +
                "<li>Yoga</li>" +
                "</ul>",
        cepat: "<strong>Rekomendasi Olahraga:</strong>" +
               "<ul>" +
               "<li>HIIT Workout</li>" +
               "<li>Lari Interval</li>" +
               "<li>Lompat Tali</li>" +
               "</ul>",
        lama: "<strong>Rekomendasi Olahraga:</strong>" +
              "<ul>" +
              "<li>Jogging / Power Walking</li>" +
              "<li>Bersepeda Jarak Jauh</li>" +
              "<li>Senam Aerobik / Zumba</li>" +
              "</ul>"
    };

    function hitungGizi() {
        var berat = parseFloat(document.getElementById("berat").value);
        var tinggiCm = parseFloat(document.getElementById("tinggi").value);

        if (!berat || !tinggiCm) {
            alert("Isi data!");
            return;
        }

        var tinggiM = tinggiCm / 100;
        var imt = berat / (tinggiM * tinggiM);
        var status = "";
        var warna = "";
        var makanan = "";
        var olahragaTeks = "";

        var containerOpsi = document.getElementById("opsi-olahraga-container");
        containerOpsi.style.display = "none"; 

        if (imt < 18.5) {
            status = "Gizi Kurang";
            warna = "#ff9800";
            makanan = "<strong>Rekomendasi Makanan:</strong>" +
                      "<ul>" +
                      "<li>Telur, dada ayam, kacang-kacangan, alpukat, susu</li>" +
                      "<li>Makan 5-6 kali sehari porsi kecil</li>" +
                      "</ul>";
            olahragaTeks = "<strong>Rekomendasi Olahraga:</strong>" +
                           "<ul>" +
                           "<li>Latihan beban (push-up, dumbbell)</li>" +
                           "<li>Batasi kardio durasi panjang</li>" +
                           "</ul>";
        } else if (imt >= 18.5 && imt <= 25.0) {
            status = "Normal (Ideal)";
            warna = "#4CAF50";
            makanan = "<strong>Rekomendasi Makanan:</strong>" +
                      "<ul>" +
                      "<li>Karbohidrat kompleks, sayuran, buah, protein</li>" +
                      "<li>Minum air putih 2 liter sehari</li>" +
                      "</ul>";
            olahragaTeks = "<strong>Rekomendasi Olahraga:</strong>" +
                           "<ul>" +
                           "<li>Kardio (jogging, sepeda) & beban ringan</li>" +
                           "<li>Rutin 3-5 kali seminggu</li>" +
                           "</ul>";
        } else {
            if (imt > 25.0 && imt <= 27.0) {
                status = "Kelebihan Berat Badan";
                warna = "#ff9800";
            } else {
                status = "Obesitas";
                warna = "#f44336";
            }
            
            makanan = "<strong>Rekomendasi Makanan:</strong>" +
                      "<ul>" +
                      "<li>Kurangi makanan manis, gorengan, tepung</li>" +
                      "<li>Perbanyak sayuran dan protein tanpa lemak</li>" +
                      "</ul>";
            
            containerOpsi.style.display = "block"; 
            olahragaTeks = "";
        }

        document.getElementById("konten-imt").innerHTML = "<div style='text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 20px; color: " + warna + ";'>IMT: " + imt.toFixed(1) + "<br>" + status + "</div>";
        document.getElementById("konten-makanan").innerHTML = "<div class='box-saran'>" + makanan + "</div>";
        
        if(imt > 25.0) {
            document.getElementById("konten-olahraga").innerHTML = "<div class='box-saran' id='box-olahraga-dinamis' style='display:none;'></div>";
        } else {
            document.getElementById("konten-olahraga").innerHTML = "<div class='box-saran' id='box-olahraga-dinamis'>" + olahragaTeks + "</div>";
        }

        document.getElementById("slide-input").style.display = "none";
        document.getElementById("slide-hasil").style.display = "block";
    }

    function pilihOlahraga(kategori) {
        var box = document.getElementById("box-olahraga-dinamis");
        box.style.display = "block";
        box.innerHTML = databaseOlahraga[kategori];
        
        var tombols = document.getElementsByClassName("btn-opsi");
        for (var i = 0; i < tombols.length; i++) {
            tombols[i].classList.remove("tombol-aktif");
        }
        event.currentTarget.classList.add("tombol-aktif");
    }

    function kembaliKeKalkulator() {
        document.getElementById("berat").value = "";
        document.getElementById("tinggi").value = "";
        document.getElementById("slide-hasil").style.display = "none";
        document.getElementById("slide-input").style.display = "block";
    }
    </script>

</body>
</html>
