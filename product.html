<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoWeby - Product (Kalkulator Gizi)</title>
    <link rel="stylesheet" href="styles.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chango&family=Redressed&display=swap" rel="stylesheet">
</head>
<body>

    <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="design.html">DESIGN</a></li>
        <li><a href="product.html">PRODUCT</a></li>
    </ul>

    <div class="wrapper-product">
        
        <div id="slide-input" class="kalkulator">
            <h2 class="judul-kalkulator">Kalkulator Gizi (IMT)</h2>
            
            <label for="berat">Berat Badan (kg):</label>
            <input type="number" id="berat" placeholder="Contoh: 55">

            <label for="tinggi">Tinggi Badan (cm):</label>
            <input type="number" id="tinggi" placeholder="Contoh: 165">

            <button onclick="hitungGizi()">Hitung Status</button>
        </div>

        <div id="slide-hasil" class="kalkulator" style="display: none;">
            <h2 class="judul-kalkulator">Hasil Analisis Gizi</h2>
            
            <div id="konten-imt"></div>
            <div id="konten-rekomendasi"></div>

            <button onclick="kembaliKeKalkulator()" style="background-color: #6f6261; margin-top: 20px;">Ulangi Hitung</button>
        </div>

    </div>

    <script>
    function hitungGizi() {
        var berat = parseFloat(document.getElementById("berat").value);
        var tinggiCm = parseFloat(document.getElementById("tinggi").value);

        if (!berat || !tinggiCm) {
            alert("Harap isi semua data dengan benar!");
            return;
        }

        var tinggiM = tinggiCm / 100;
        var imt = berat / (tinggiM * tinggiM);
        var status = "";
        var warna = "";
        var rekomendasi = "";

        if (imt < 18.5) {
            status = "Kekurangan Berat Badan (Gizi Kurang)";
            warna = "#ff9800";
            rekomendasi = "<strong>🥗 Rekomendasi Makanan:</strong>" +
                          "<ul>" +
                          "<li>Konsumsi makanan padat nutrisi: telur, dada ayam, kacang-kacangan, alpukat, dan susu.</li>" +
                          "<li>Tambah frekuensi makan menjadi 5-6 kali sehari dalam porsi kecil namun sering.</li>" +
                          "</ul>" +
                          "<strong>🏋️ Rekomendasi Olahraga:</strong>" +
                          "<ul>" +
                          "<li>Fokus pada latihan beban (strength training) untuk membangun massa otot, bukan lemak.</li>" +
                          "<li>Batasi olahraga kardio berdurasi panjang seperti lari maraton.</li>" +
                          "</ul>";
        } else if (imt >= 18.5 && imt <= 25.0) {
            status = "Normal (Ideal)";
            warna = "#4CAF50";
            rekomendasi = "<strong>🥗 Rekomendasi Makanan:</strong>" +
                          "<ul>" +
                          "<li>Pertahankan pola makan seimbang: karbohidrat kompleks, serat sayuran, buah, dan protein.</li>" +
                          "<li>Jaga hidrasi dengan minum air putih minimal 2 liter sehari.</li>" +
                          "</ul>" +
                          "<strong>🏋️ Rekomendasi Olahraga:</strong>" +
                          "<ul>" +
                          "<li>Kombinasikan olahraga kardio (jogging, bersepeda) dengan latihan beban ringan.</li>" +
                          "<li>Lakukan secara rutin 3-5 kali seminggu selama 30-45 menit.</li>" +
                          "</ul>";
        } else if (imt > 25.0 && imt <= 27.0) {
            status = "Kelebihan Berat Badan (Tingkat Ringan)";
            warna = "#ff9800";
            rekomendasi = "<strong>🥗 Rekomendasi Makanan:</strong>" +
                          "<ul>" +
                          "<li>Kurangi makanan manis, gorengan, dan karbohidrat olahan (tepung-tepungan).</li>" +
                          "<li>Perbanyak porsi sayur berlipat ganda dan ganti camilan dengan buah segar.</li>" +
                          "</ul>" +
                          "<strong>🏋️ Rekomendasi Olahraga:</strong>" +
                          "<ul>" +
                          "<li>Tingkatkan latihan kardio seperti jalan cepat, aerobik, atau bersepeda untuk membakar kalori.</li>" +
                          "<li>Mulai rutin melakukan squat atau plank untuk mengencangkan otot tubuh.</li>" +
                          "</ul>";
        } else {
            status = "Obesitas (Gizi Lebih)";
            warna = "#f44336";
            rekomendasi = "<strong>🥗 Rekomendasi Makanan:</strong>" +
                          "<ul>" +
                          "<li>Terapkan defisit kalori yang sehat (kontrol porsi makan dengan ketat).</li>" +
                          "<li>Hindari minuman kemasan berpemanis tinggi dan kurangi penggunaan garam berlebih.</li>" +
                          "</ul>" +
                          "<strong>🏋️ Rekomendasi Olahraga:</strong>" +
                          "<ul>" +
                          "<li>Pilih olahraga low-impact yang aman untuk sendi: jalan kaki santai, berenang, atau bersepeda statis.</li>" +
                          "<li>Mulai dari durasi ringan (15-20 menit) lalu tingkatkan secara bertahap seiring kebugaran membaik.</li>" +
                          "</ul>";
        }

        // Cetak hasil ke elemen slide kedua
        document.getElementById("konten-imt").innerHTML = "<div style='text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 20px; color: " + warna + ";'>Nilai IMT: " + imt.toFixed(1) + "<br>Status: " + status + "</div>";
        document.getElementById("konten-rekomendasi").innerHTML = "<div style='text-align: left; font-weight: normal; color: #333; font-size: 15px;'>" + rekomendasi + "</div>";

        // LEMPAR TAMPILAN (Sembunyikan input, Munculkan hasil)
        document.getElementById("slide-input").style.display = "none";
        document.getElementById("slide-hasil").style.display = "block";
    }

    function kembaliKeKalkulator() {
        // Reset input nilai di form
        document.getElementById("berat").value = "";
        document.getElementById("tinggi").value = "";

        // LEMPAR BALIK TAMPILAN (Sembunyikan hasil, Munculkan input lagi)
        document.getElementById("slide-hasil").style.display = "none";
        document.getElementById("slide-input").style.display = "block";
    }
    </script>

</body>
</html>
